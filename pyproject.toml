[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowvault"
version = "2.0.0"
description = "Automated YouTube Shorts content pipeline (horror/mystery/motivation)"
requires-python = ">=3.9"
dependencies = [
    "moviepy>=1.0.3,<2.0",
    "aiohttp>=3.9,<3.11",
    "edge-tts>=6.1.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0,<2.0",
    "requests>=2.31.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.100.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
shadowvault = "shadowvault.pipeline:main"

[tool.setuptools.packages.find]
include = ["shadowvault*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
